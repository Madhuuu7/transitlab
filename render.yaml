# Render free-tier deployment: one web service serving both the API and the
# map UI, so there is no second origin to configure and no CORS to get wrong.
#
# The feed is the committed Bengaluru snapshot, not a GTFS zip. That is not a
# convenience -- it is what makes this deployable at all. Ingesting the BMTC
# feed costs 15 s and peaks near 1.6 GB of resident memory to produce 15 MB of
# flat arrays; a free instance has 512 MB, so a server that ingests on boot
# cannot run a city it can comfortably serve. Loading the snapshot instead
# takes 0.14 s and 96 MB. See src/transitlab/gtfs/snapshot.py.
#
# Rebuild the snapshot locally after changing the loader, the footpath
# generator or the CSR layout -- the archive carries a format version and a
# stale one is refused rather than mis-read:
#
#   python scripts/make_snapshot.py data/bmtc.zip data/bmtc.npz --walk-radius 250
#
# Data terms (ODbL-1.0, unofficial feed) are in ATTRIBUTION.md.
services:
  - type: web
    name: transitlab
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn transitlab.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TRANSITLAB_FEED
        value: data/bmtc.npz
