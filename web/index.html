<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>transitlab</title>
<meta name="description" content="RAPTOR journey planning over real GTFS data." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     The accent scale is the isochrone time ramp. The interface and the
     map legend use one vocabulary, because the premise of the whole
     application is that distance is measured in minutes.
     ------------------------------------------------------------------ */
  :root {
    --paper: #fbfaf8;
    --paper-2: #f3f1ec;
    --paper-3: #eae7e0;
    --rule: #e2ded5;
    --rule-strong: #cfcabd;
    --ink: #1a1b2e;
    --ink-2: #5b5e73;
    --ink-3: #8b8d9e;
    --accent: #4733d1;
    --accent-soft: #ece9ff;

    --t1: #0fa47f;
    --t2: #2d7fc1;
    --t3: #5b4bdb;
    --t4: #9243c6;
    --t5: #c32b64;

    --walk: #6a6d82;

    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

    --panel-w: 400px;
    --lift: 0 1px 2px rgba(26, 27, 46, 0.06), 0 8px 24px -6px rgba(26, 27, 46, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; background: var(--paper-2); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------------------------------------------------------------- */
  .shell {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: var(--panel-w) 1fr;
    gap: 16px;
    padding: 16px;
    pointer-events: none;
  }

  .panel {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: var(--lift);
    overflow: hidden;
  }

  /* --- masthead ---------------------------------------------------- */
  .masthead {
    padding: 18px 20px 16px;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .wordmark b { font-weight: 700; }
  .wordmark span { color: var(--accent); }
  .network {
    margin: 9px 0 0;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.45;
  }
  .network .count {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    color: var(--ink);
  }

  /* --- mode switch -------------------------------------------------
     Two views of one computation, so they read as a single control
     rather than two buttons that happen to sit together. */
  .modes {
    display: flex;
    margin: 16px 20px 0;
    padding: 3px;
    background: var(--paper-2);
    border-radius: 9px;
  }
  .mode {
    flex: 1;
    padding: 7px 10px;
    font: 500 13px/1.3 var(--sans);
    color: var(--ink-2);
    background: none;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .mode[aria-selected="true"] {
    color: var(--ink);
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(26, 27, 46, 0.08);
  }
  .mode:hover[aria-selected="false"] { color: var(--ink); }

  /* --- query form -------------------------------------------------- */
  form { padding: 16px 20px 18px; display: grid; gap: 11px; }
  .field { display: grid; gap: 5px; }
  .field > span {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  input, .combo input {
    width: 100%;
    padding: 9px 11px;
    font: 400 13.5px/1.3 var(--sans);
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder { color: var(--ink-3); }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.time { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* --- searchable stop picker -------------------------------------
     A select with 9,948 options is not a control, it is a wall. */
  .combo { position: relative; }
  /* Offset from the bottom, not centred: the field box includes its label,
     so 50% would land between the label and the input. */
  .combo .marker {
    position: absolute;
    left: 11px;
    bottom: 15px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    pointer-events: none;
  }
  .combo.from .marker { background: var(--t1); }
  .combo.to .marker { background: var(--t5); }
  .combo input { padding-left: 27px; }
  .combo ul {
    position: absolute;
    z-index: 30;
    top: calc(100% + 5px);
    left: 0;
    right: 0;
    max-height: 244px;
    overflow-y: auto;
    margin: 0;
    padding: 5px;
    list-style: none;
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-radius: 10px;
    box-shadow: var(--lift);
  }
  .combo ul[hidden] { display: none; }
  .combo li {
    padding: 7px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
  }
  .combo li[aria-selected="true"] { background: var(--accent-soft); }
  .combo li .id {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    flex: none;
  }
  .combo li .nope { color: var(--ink-3); }

  .swap {
    justify-self: start;
    margin: -4px 0 -2px;
    padding: 4px 8px 4px 0;
    font: 500 12.5px/1 var(--sans);
    color: var(--accent);
    background: none;
    border: 0;
    cursor: pointer;
  }
  .swap:hover { text-decoration: underline; }

  .go {
    margin-top: 3px;
    padding: 11px;
    font: 500 14px/1 var(--sans);
    letter-spacing: -0.005em;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
  }
  .go:hover { background: #3c2ab4; }
  .go:active { transform: translateY(1px); }
  .go[disabled] { background: var(--ink-3); cursor: progress; }

  .tip {
    font-size: 12px;
    color: var(--ink-3);
    line-height: 1.45;
  }
  .tip kbd {
    font: 500 11px/1 var(--mono);
    padding: 2px 4px;
    color: var(--ink-2);
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
  }

  /* --- results ----------------------------------------------------- */
  .results {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 20px 20px;
    border-top: 1px solid var(--rule);
  }
  .results::-webkit-scrollbar { width: 10px; }
  .results::-webkit-scrollbar-thumb {
    background: var(--paper-3);
    border: 3px solid var(--paper);
    border-radius: 10px;
  }

  .blank {
    padding: 22px 0 6px;
    font-size: 13.5px;
    color: var(--ink-2);
    max-width: 34ch;
  }

  .verdict {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 18px 0 2px;
  }
  .verdict .dur {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.045em;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
  }
  .verdict .unit { font-size: 14px; color: var(--ink-2); }
  .verdict .window {
    margin-left: auto;
    text-align: right;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .shape {
    display: flex;
    gap: 14px;
    padding: 10px 0 16px;
    font-size: 12.5px;
    color: var(--ink-2);
    border-bottom: 1px solid var(--rule);
  }
  .shape b {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--ink);
  }

  /* --- the strip ---------------------------------------------------
     A transit diagram: spine, interchange rings, route plaques. The
     sequence is carried by the drawing, so the rows are not numbered. */
  .strip { margin: 0; padding: 14px 0 0; list-style: none; }
  .strip li {
    display: grid;
    grid-template-columns: 46px 18px 1fr;
    gap: 0 10px;
    min-height: 30px;
  }
  .strip .clock {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink);
    padding-top: 1px;
  }
  .strip .rail { position: relative; }
  .strip .rail::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    margin-left: -1.5px;
    background: var(--seg, var(--rule-strong));
  }
  .strip li.first .rail::before { top: 7px; }
  .strip li.last .rail::before { bottom: calc(100% - 7px); }
  /* Only walking hops are dotted. A bus leg keeps the solid spine, which
     is the one thing the drawing has to get right. */
  .strip li.hop.walk .rail::before {
    width: 0;
    background: none;
    border-left: 3px dotted var(--walk);
  }

  .strip .node {
    position: absolute;
    left: 50%;
    top: 1px;
    width: 11px;
    height: 11px;
    margin-left: -5.5px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--seg, var(--ink));
  }
  .strip li.terminus .node {
    width: 13px;
    height: 13px;
    margin-left: -6.5px;
    background: var(--seg, var(--ink));
    box-shadow: 0 0 0 3px var(--paper);
  }

  .strip .place {
    padding-bottom: 14px;
    font-size: 13.5px;
    font-weight: 450;
    letter-spacing: -0.005em;
  }
  .strip .place .note {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-3);
  }
  .strip li.hop .place {
    font-size: 12.5px;
    color: var(--ink-2);
    padding-bottom: 14px;
  }

  /* Route numbers sit in a plaque because that is how a bus shows
     one. The border is information, not ornament. */
  .plaque {
    display: inline-block;
    padding: 2px 7px;
    font: 500 12px/1.45 var(--mono);
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--seg, var(--ink));
    border-radius: 5px;
    vertical-align: 1px;
  }
  .strip .place .plaque { margin-right: 7px; }

  /* --- alternatives ------------------------------------------------ */
  .alts { padding-top: 4px; }
  .alts h2 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .alts p { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-3); }
  .alt {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    padding: 9px 11px;
    margin-bottom: 6px;
    font: 400 13px/1.3 var(--sans);
    color: var(--ink);
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .alt:hover { border-color: var(--rule-strong); background: var(--paper-2); }
  .alt[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .alt .cost {
    margin-left: auto;
    font-family: var(--mono);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .alt .delta { font-size: 12px; color: var(--ink-2); }

  /* --- isochrone readout ------------------------------------------- */
  .ramp { padding: 16px 0 0; }
  .ramp .bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
  }
  .ramp .bar i { display: block; }
  .ramp .scale {
    display: flex;
    justify-content: space-between;
    padding-top: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .ramp table {
    width: 100%;
    margin-top: 14px;
    border-collapse: collapse;
    font-size: 13px;
  }
  .ramp td {
    padding: 7px 0;
    border-bottom: 1px solid var(--rule);
  }
  .ramp tr:last-child td { border-bottom: 0; }
  .ramp td.swatch { width: 16px; }
  .ramp td.swatch i {
    display: block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
  }
  .ramp td.n {
    text-align: right;
    font-family: var(--mono);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .ramp td.share {
    width: 52px;
    text-align: right;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
  }

  /* --- footer ------------------------------------------------------ */
  footer {
    padding: 11px 20px;
    border-top: 1px solid var(--rule);
    background: var(--paper-2);
    font-size: 11.5px;
    color: var(--ink-3);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  footer a { color: var(--ink-2); text-decoration: none; }
  footer a:hover { color: var(--accent); text-decoration: underline; }
  footer .sep { margin-left: auto; }

  .alarm {
    margin: 16px 0 0;
    padding: 10px 12px;
    font-size: 12.5px;
    color: #8a1c3f;
    background: #fdeef3;
    border: 1px solid #f3cdd9;
    border-radius: 8px;
  }

  /* --- map furniture ----------------------------------------------- */
  .legend {
    pointer-events: auto;
    align-self: end;
    justify-self: start;
    display: none;
    gap: 9px;
    align-items: center;
    padding: 9px 13px;
    font-size: 12px;
    color: var(--ink-2);
    background: rgba(251, 250, 248, 0.94);
    backdrop-filter: blur(6px);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: var(--lift);
  }
  .legend.on { display: flex; }
  .legend .key { display: flex; align-items: center; gap: 6px; }
  .legend .line { width: 18px; height: 3px; border-radius: 2px; background: var(--accent); }
  .legend .line.walk {
    background: none;
    border-top: 3px dotted var(--walk);
    height: 0;
  }

  .maplibregl-popup-content {
    padding: 7px 10px;
    font: 400 12.5px/1.4 var(--sans);
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    box-shadow: var(--lift);
  }
  .maplibregl-popup-content b {
    font-family: var(--mono);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .maplibregl-popup-tip { display: none; }
  .maplibregl-ctrl-group { border-radius: 9px !important; box-shadow: var(--lift) !important; }

  /* --- small screens: the panel becomes a sheet -------------------- */
  @media (max-width: 820px) {
    .shell {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      padding: 10px;
      gap: 10px;
    }
    .panel { max-height: 64vh; }
    .legend { display: none !important; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="shell">
  <aside class="panel">
    <div class="masthead">
      <h1 class="wordmark">transit<b>lab</b><span>.</span></h1>
      <p class="network" id="network">Reading the feed&hellip;</p>
    </div>

    <div class="modes" role="tablist" aria-label="What to compute">
      <button class="mode" role="tab" id="mode-journey" aria-selected="true">Plan a journey</button>
      <button class="mode" role="tab" id="mode-isochrone" aria-selected="false">Map reach</button>
    </div>

    <form id="query" autocomplete="off">
      <div class="field combo from" id="combo-from">
        <span><label for="from">Start</label></span>
        <i class="marker"></i>
        <input id="from" type="text" role="combobox" aria-expanded="false"
               aria-controls="list-from" placeholder="Search stops" />
        <ul id="list-from" role="listbox" hidden></ul>
      </div>

      <button class="swap" id="swap" type="button">Reverse</button>

      <div class="field combo to" id="combo-to">
        <span><label for="to">Destination</label></span>
        <i class="marker"></i>
        <input id="to" type="text" role="combobox" aria-expanded="false"
               aria-controls="list-to" placeholder="Search stops" />
        <ul id="list-to" role="listbox" hidden></ul>
      </div>

      <div class="pair">
        <label class="field"><span>Leave at</span>
          <input class="time" id="time" value="08:00" inputmode="numeric" />
        </label>
        <label class="field" id="field-change"><span>Change time</span>
          <input class="time" id="change" value="120" inputmode="numeric" />
        </label>
      </div>

      <label class="field" id="field-budget" hidden><span>Minutes to spend</span>
        <input class="time" id="budget" value="30" inputmode="numeric" />
      </label>

      <button class="go" id="go" type="submit">Find the fastest way</button>
      <p class="tip">Click a stop on the map to set the start,
        <kbd>shift</kbd>-click to set the destination.</p>
    </form>

    <div class="results" id="results"></div>

    <footer>
      <span id="feed">&mdash;</span>
      <a class="sep" href="/docs" target="_blank" rel="noreferrer">API</a>
      <a href="https://github.com/Madhuuu7/transitlab" target="_blank" rel="noreferrer">Source</a>
    </footer>
  </aside>

  <div class="legend" id="legend">
    <span class="key"><i class="line"></i> on a bus</span>
    <span class="key"><i class="line walk"></i> on foot</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";

  // The ramp is the design system's accent scale as well as the map's
  // encoding, so it is declared once and read by both.
  const RAMP = [
    { max: 10, color: "#0fa47f", label: "under 10 min" },
    { max: 20, color: "#2d7fc1", label: "10 to 20 min" },
    { max: 30, color: "#5b4bdb", label: "20 to 30 min" },
    { max: 45, color: "#9243c6", label: "30 to 45 min" },
    { max: Infinity, color: "#c32b64", label: "45 min and over" },
  ];
  const ACCENT = "#4733d1";
  const WALK = "#6a6d82";
  const START = "#0fa47f";
  const END = "#c32b64";

  const $ = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const state = {
    stops: [],
    byId: new Map(),
    mode: "journey",
    journeys: [],
    chosen: 0,
    from: null,
    to: null,
  };

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ------------------------------------------------------------------ map
  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        base: {
          type: "raster",
          tiles: ["https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png"],
          tileSize: 256,
          attribution:
            '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>, © <a href="https://carto.com/attributions">CARTO</a>',
        },
      },
      layers: [{ id: "base", type: "raster", source: "base" }],
    },
    center: [77.59, 12.97],
    zoom: 11,
    attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

  const EMPTY = { type: "FeatureCollection", features: [] };

  map.on("load", async () => {
    for (const id of ["bloom", "stops", "route", "ends"]) {
      map.addSource(id, { type: "geojson", data: EMPTY });
    }

    // Reached stops read as a field rather than confetti: a wide blurred
    // disc under each crisp dot, so density becomes visible.
    map.addLayer({
      id: "bloom",
      type: "circle",
      source: "bloom",
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 14, 15, 34],
        "circle-color": ["get", "color"],
        "circle-blur": 1,
        "circle-opacity": 0.22,
      },
    });

    map.addLayer({
      id: "stops",
      type: "circle",
      source: "stops",
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 2.6, 13, 4.2, 16, 7],
        "circle-color": ["get", "color"],
        "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.4],
        "circle-stroke-color": "#fbfaf8",
        "circle-opacity": ["get", "opacity"],
      },
    });

    // White casing under the route line: standard transit cartography,
    // and the only thing that keeps a line legible over a pale basemap.
    map.addLayer({
      id: "route-casing",
      type: "line",
      source: "route",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#fbfaf8", "line-width": 9, "line-opacity": 0.95 },
    });
    map.addLayer({
      id: "route-walk",
      type: "line",
      source: "route",
      filter: ["==", ["get", "kind"], "walk"],
      layout: { "line-cap": "round" },
      paint: { "line-color": WALK, "line-width": 3, "line-dasharray": [0.1, 2] },
    });
    map.addLayer({
      id: "route-ride",
      type: "line",
      source: "route",
      filter: ["==", ["get", "kind"], "ride"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 4.5 },
    });

    map.addLayer({
      id: "ends",
      type: "circle",
      source: "ends",
      paint: {
        "circle-radius": 7,
        "circle-color": ["get", "color"],
        "circle-stroke-width": 3,
        "circle-stroke-color": "#fbfaf8",
      },
    });

    map.on("click", "stops", (event) => {
      const stop = state.byId.get(event.features[0].properties.stop_id);
      if (!stop) return;
      if (event.originalEvent.shiftKey && state.mode === "journey") setStop("to", stop);
      else setStop("from", stop);
      run();
    });
    map.on("mouseenter", "stops", () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", "stops", () => (map.getCanvas().style.cursor = ""));

    let hover = null;
    map.on("mousemove", "stops", (event) => {
      const p = event.features[0].properties;
      if (hover) hover.remove();
      hover = new maplibregl.Popup({ closeButton: false, offset: 11, className: "stop-pop" })
        .setLngLat(event.lngLat)
        .setHTML(p.arrival ? `${esc(p.name)} &middot; <b>${esc(p.arrival)}</b>` : esc(p.name))
        .addTo(map);
    });
    map.on("mouseleave", "stops", () => {
      if (hover) { hover.remove(); hover = null; }
    });

    await boot();
  });

  // ----------------------------------------------------------------- boot
  async function boot() {
    try {
      const [feed, stops] = await Promise.all([
        fetch("/feed").then((r) => r.json()),
        fetch("/stops?limit=12000").then((r) => r.json()),
      ]);

      state.stops = stops;
      state.byId = new Map(stops.map((s) => [s.stop_id, s]));

      const n = (v) => `<span class="count">${v.toLocaleString()}</span>`;
      $("network").innerHTML =
        `${n(feed.stops)} stops and ${n(feed.stop_times)} scheduled ` +
        `departures, searched with RAPTOR.`;
      $("feed").textContent = feed.feed;

      if (stops.length) {
        setStop("from", stops[0]);
        setStop("to", stops[stops.length - 1]);
      }
      paintStops();
      frame(stops);
      blank();
    } catch (error) {
      $("network").textContent = "The API did not answer.";
      alarm(`Could not reach the API: ${error.message}`);
    }
  }

  function frame(stops) {
    if (!stops.length) return;
    const bounds = stops.reduce(
      (b, s) => b.extend([s.lon, s.lat]),
      new maplibregl.LngLatBounds([stops[0].lon, stops[0].lat], [stops[0].lon, stops[0].lat]),
    );
    const narrow = window.matchMedia("(max-width: 820px)").matches;
    map.fitBounds(bounds, {
      padding: narrow
        ? { top: 40, right: 40, bottom: 40, left: 40 }
        : { top: 60, right: 80, bottom: 60, left: 460 },
      duration: reduceMotion ? 0 : 900,
    });
  }

  // -------------------------------------------------------------- pickers
  function setStop(which, stop) {
    state[which] = stop;
    $(which).value = stop ? `${stop.name}` : "";
    $(which).dataset.id = stop ? stop.stop_id : "";
  }

  function combobox(which) {
    const input = $(which);
    const list = $(`list-${which}`);
    let active = -1;
    let matches = [];

    const close = () => {
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      active = -1;
    };

    const render = (query) => {
      const needle = query.trim().toLowerCase();
      matches = (needle
        ? state.stops.filter(
            (s) =>
              s.name.toLowerCase().includes(needle) ||
              s.stop_id.toLowerCase().includes(needle),
          )
        : state.stops
      ).slice(0, 80);

      if (!matches.length) {
        list.innerHTML = `<li class="nope" aria-disabled="true">No stop matches &ldquo;${esc(query)}&rdquo;</li>`;
      } else {
        list.innerHTML = matches
          .map(
            (s, i) =>
              `<li role="option" data-i="${i}" aria-selected="${i === active}">` +
              `<span>${esc(s.name)}</span><span class="id">${esc(s.stop_id)}</span></li>`,
          )
          .join("");
      }
      list.hidden = false;
      input.setAttribute("aria-expanded", "true");
    };

    const highlight = (next) => {
      active = next;
      for (const li of list.querySelectorAll("li[role=option]")) {
        const on = Number(li.dataset.i) === active;
        li.setAttribute("aria-selected", String(on));
        if (on) li.scrollIntoView({ block: "nearest" });
      }
    };

    const commit = (i) => {
      if (!matches[i]) return;
      setStop(which, matches[i]);
      close();
      run();
    };

    input.addEventListener("focus", () => { active = -1; render(""); input.select(); });
    input.addEventListener("input", () => { active = -1; render(input.value); });
    input.addEventListener("blur", () => {
      // Let a click on an option land before the list goes away.
      setTimeout(() => {
        close();
        if (state[which]) input.value = state[which].name;
      }, 120);
    });
    input.addEventListener("keydown", (event) => {
      if (list.hidden && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
        render(input.value);
        return;
      }
      if (event.key === "ArrowDown") {
        event.preventDefault();
        highlight(Math.min(active + 1, matches.length - 1));
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        highlight(Math.max(active - 1, 0));
      } else if (event.key === "Enter") {
        if (!list.hidden && active >= 0) { event.preventDefault(); commit(active); }
      } else if (event.key === "Escape") {
        close();
      }
    });
    list.addEventListener("mousedown", (event) => {
      const li = event.target.closest("li[role=option]");
      if (li) { event.preventDefault(); commit(Number(li.dataset.i)); }
    });
  }
  combobox("from");
  combobox("to");

  $("swap").addEventListener("click", () => {
    const { from, to } = state;
    if (!from || !to) return;
    setStop("from", to);
    setStop("to", from);
    run();
  });

  // ----------------------------------------------------------------- mode
  function setMode(mode) {
    state.mode = mode;
    $("mode-journey").setAttribute("aria-selected", String(mode === "journey"));
    $("mode-isochrone").setAttribute("aria-selected", String(mode === "isochrone"));
    $("combo-to").hidden = mode !== "journey";
    $("swap").hidden = mode !== "journey";
    $("field-budget").hidden = mode !== "isochrone";
    $("go").textContent = mode === "journey" ? "Find the fastest way" : "Show what is reachable";
    $("legend").classList.toggle("on", false);
    map.getSource("route").setData(EMPTY);
    map.getSource("ends").setData(EMPTY);
    map.getSource("bloom").setData(EMPTY);
    paintStops();
    blank();
  }
  $("mode-journey").addEventListener("click", () => setMode("journey"));
  $("mode-isochrone").addEventListener("click", () => setMode("isochrone"));

  function blank() {
    $("results").innerHTML =
      state.mode === "journey"
        ? `<p class="blank">Pick a start and a destination. You get the
           fastest arrival, plus the options that use fewer buses.</p>`
        : `<p class="blank">Pick a start and a time budget to see every stop
           you could be standing at before it runs out.</p>`;
  }

  // ----------------------------------------------------------------- draw
  function paintStops(reached) {
    const hit = new Map((reached || []).map((s) => [s.stop_id, s]));
    const features = [];
    const blooms = [];

    for (const s of state.stops) {
      const found = hit.get(s.stop_id);
      const band = found ? RAMP.find((b) => found.minutes <= b.max) : null;
      features.push({
        type: "Feature",
        geometry: { type: "Point", coordinates: [s.lon, s.lat] },
        properties: {
          stop_id: s.stop_id,
          name: s.name,
          color: band ? band.color : "#a8aebf",
          opacity: reached ? (band ? 1 : 0.28) : 0.85,
          arrival: found ? `${found.arrival} · ${found.minutes} min` : null,
        },
      });
      if (band) {
        blooms.push({
          type: "Feature",
          geometry: { type: "Point", coordinates: [s.lon, s.lat] },
          properties: { color: band.color },
        });
      }
    }
    map.getSource("stops").setData({ type: "FeatureCollection", features });
    map.getSource("bloom").setData({ type: "FeatureCollection", features: blooms });
  }

  const pin = (stop, color) => ({
    type: "Feature",
    geometry: { type: "Point", coordinates: [stop.lon, stop.lat] },
    properties: { color },
  });

  function drawRoute(journey) {
    const features = [];
    let ride = 0;
    for (const leg of journey ? journey.legs : []) {
      const a = state.byId.get(leg.from_stop);
      const b = state.byId.get(leg.to_stop);
      if (!a || !b) continue;
      // Straight segments between stops: shapes.txt geometry is not loaded,
      // so this shows the connection, not the road the bus takes.
      features.push({
        type: "Feature",
        geometry: { type: "LineString", coordinates: [[a.lon, a.lat], [b.lon, b.lat]] },
        properties: {
          kind: leg.kind,
          color: leg.kind === "ride" ? legColor(ride++) : WALK,
        },
      });
    }
    map.getSource("route").setData({ type: "FeatureCollection", features });

    const ends = [];
    const legs = journey ? journey.legs : [];
    if (legs.length) {
      const a = state.byId.get(legs[0].from_stop);
      const b = state.byId.get(legs[legs.length - 1].to_stop);
      if (a) ends.push(pin(a, START));
      if (b) ends.push(pin(b, END));
    }
    map.getSource("ends").setData({ type: "FeatureCollection", features: ends });
    $("legend").classList.toggle("on", features.length > 0);
  }

  // Successive bus legs step along the ramp, so the strip and the map
  // agree about which leg is which without needing a key.
  const legColor = (index) => [RAMP[2].color, RAMP[1].color, RAMP[3].color, RAMP[0].color][index % 4];

  // --------------------------------------------------------------- submit
  $("query").addEventListener("submit", (event) => {
    event.preventDefault();
    run();
  });

  let pending = false;
  async function run() {
    if (pending) return;
    if (!state.from || (state.mode === "journey" && !state.to)) return;
    pending = true;
    $("go").disabled = true;
    try {
      if (state.mode === "journey") await planJourney();
      else await mapReach();
    } catch (error) {
      alarm(error.message);
    } finally {
      pending = false;
      $("go").disabled = false;
    }
  }

  async function planJourney() {
    const params = new URLSearchParams({
      from: state.from.stop_id,
      to: state.to.stop_id,
      time: $("time").value.trim() || "08:00",
      change_time: $("change").value.trim() || "0",
    });
    const response = await fetch(`/journey?${params}`);
    const body = await response.json();
    if (!response.ok) throw new Error(detail(body) || "The journey request failed.");

    state.journeys = [body.fastest, ...(body.alternatives || [])].filter(Boolean);
    state.chosen = 0;
    paintStops();
    renderJourney(body);
    drawRoute(body.fastest);
  }

  function detail(body) {
    if (!body || body.detail == null) return null;
    if (typeof body.detail === "string") return body.detail;
    return JSON.stringify(body.detail);
  }

  function renderJourney(body) {
    const results = $("results");
    if (!body.fastest) {
      results.innerHTML =
        `<p class="blank">No way to get from <b>${esc(body.origin.name)}</b> to ` +
        `<b>${esc(body.destination.name)}</b> after ${esc(body.requested_departure)}. ` +
        `Service may be finished for the day — try an earlier time.</p>`;
      drawRoute(null);
      return;
    }

    const j = body.fastest;
    results.innerHTML =
      verdictHtml(j) +
      `<ol class="strip">${stripHtml(j)}</ol>` +
      altsHtml(body.alternatives, j);

    bindAlts();
    drawStrip();
  }

  function verdictHtml(j) {
    const changes = j.transfers === 1 ? "1 change" : `${j.transfers} changes`;
    return `
      <div class="verdict">
        <span class="dur">${j.duration_minutes}</span><span class="unit">min</span>
        <span class="window">${esc(j.departure.slice(0, 5))} &rarr; ${esc(j.arrival.slice(0, 5))}</span>
      </div>
      <div class="shape">
        <span>${changes}</span>
        <span><b>${j.walk_minutes}</b> min on foot</span>
        <span><b>${j.legs.filter((l) => l.kind === "ride").length}</b> buses</span>
      </div>`;
  }

  // The strip alternates places and the hops between them, which is what
  // a transit diagram is: nodes on a line, with the line labelled.
  function stripHtml(j) {
    const rows = [];
    let ride = 0;

    // The time against a place is when you are standing there. A walk leg
    // carries no departure of its own, so the honest clock is the arrival of
    // whatever brought you -- otherwise every stop before a walk reads blank.
    const clockAt = (index) => {
      const here = j.legs[index];
      if (index === 0) return here.departure || j.departure || "";
      return j.legs[index - 1].arrival || here.departure || "";
    };

    j.legs.forEach((leg, index) => {
      const colour = leg.kind === "ride" ? legColor(ride) : WALK;
      const first = index === 0;

      rows.push(
        `<li class="place-row${first ? " first terminus" : ""}" style="--seg:${colour}">
          <span class="clock">${esc(clockAt(index).slice(0, 5))}</span>
          <span class="rail"><i class="node"></i></span>
          <span class="place">${esc(leg.from_name)}</span>
        </li>`,
      );

      if (leg.kind === "ride") {
        rows.push(
          `<li class="hop" style="--seg:${colour}">
            <span class="clock"></span>
            <span class="rail"></span>
            <span class="place"><span class="plaque">${esc(leg.route_id)}</span>${
              minutes(leg)} min to ${esc(leg.to_name)}</span>
          </li>`,
        );
        ride += 1;
      } else {
        rows.push(
          `<li class="hop walk" style="--seg:${colour}">
            <span class="clock"></span>
            <span class="rail"></span>
            <span class="place">Walk ${Math.round(leg.seconds / 60)} min to ${esc(leg.to_name)}</span>
          </li>`,
        );
      }
    });

    const last = j.legs[j.legs.length - 1];
    rows.push(
      `<li class="place-row last terminus" style="--seg:${END}">
        <span class="clock">${esc((last.arrival || j.arrival).slice(0, 5))}</span>
        <span class="rail"><i class="node"></i></span>
        <span class="place">${esc(last.to_name)}<span class="note">You arrive here</span></span>
      </li>`,
    );
    return rows.join("");
  }

  const minutes = (leg) => {
    if (leg.seconds) return Math.round(leg.seconds / 60);
    return "";
  };

  // The one orchestrated moment on the page: the strip draws itself in
  // sequence, because the sequence is the thing that just got computed.
  function drawStrip() {
    if (reduceMotion) return;
    const rows = $("results").querySelectorAll(".strip li");
    rows.forEach((row, index) => {
      row.animate(
        [
          { opacity: 0, transform: "translateY(-6px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        { duration: 260, delay: index * 45, easing: "cubic-bezier(.2,.7,.3,1)", fill: "backwards" },
      );
    });
  }

  function altsHtml(alternatives, fastest) {
    if (!alternatives || !alternatives.length) return "";
    const rows = alternatives
      .map((a, i) => {
        const lost = a.duration_minutes - fastest.duration_minutes;
        const changes = a.transfers === 1 ? "1 change" : `${a.transfers} changes`;
        return `<button class="alt" type="button" data-i="${i + 1}" aria-pressed="false">
          <span>${changes}</span>
          ${lost > 0 ? `<span class="delta">+${lost} min</span>` : ""}
          <span class="cost">${a.duration_minutes} min</span>
        </button>`;
      })
      .join("");
    return `<div class="alts">
      <h2>Fewer buses</h2>
      <p>Slower, but you stay on board longer.</p>
      ${rows}</div>`;
  }

  function bindAlts() {
    const buttons = Array.from(document.querySelectorAll(".alt"));
    for (const button of buttons) {
      button.addEventListener("click", () => {
        const index = Number(button.dataset.i);
        const journey = state.journeys[index];
        if (!journey) return;
        const already = button.getAttribute("aria-pressed") === "true";
        for (const other of buttons) other.setAttribute("aria-pressed", "false");
        if (already) {
          state.chosen = 0;
          drawRoute(state.journeys[0]);
        } else {
          button.setAttribute("aria-pressed", "true");
          state.chosen = index;
          drawRoute(journey);
        }
      });
    }
  }

  // ------------------------------------------------------------- reach
  async function mapReach() {
    const params = new URLSearchParams({
      from: state.from.stop_id,
      time: $("time").value.trim() || "08:00",
      minutes: $("budget").value.trim() || "30",
      change_time: $("change").value.trim() || "0",
    });
    const response = await fetch(`/isochrone?${params}`);
    const body = await response.json();
    if (!response.ok) throw new Error(detail(body) || "The reach request failed.");

    map.getSource("route").setData(EMPTY);
    const origin = state.byId.get(body.origin.stop_id);
    map.getSource("ends").setData({
      type: "FeatureCollection",
      features: origin ? [pin(origin, START)] : [],
    });
    paintStops(body.reached);
    $("legend").classList.toggle("on", false);

    const within = RAMP.map((band, i) => {
      const lower = i === 0 ? -1 : RAMP[i - 1].max;
      return body.reached.filter((s) => s.minutes > lower && s.minutes <= band.max).length;
    });
    const total = body.reached.length || 1;
    const budget = body.budget_minutes;

    $("results").innerHTML = `
      <div class="verdict">
        <span class="dur">${body.reached.length.toLocaleString()}</span>
        <span class="unit">stops</span>
        <span class="window">${esc(body.departure.slice(0, 5))} + ${budget} min</span>
      </div>
      <div class="shape">
        <span>from ${esc(body.origin.name)}</span>
      </div>
      <div class="ramp">
        <div class="bar">${RAMP.map(
          (b, i) => `<i style="background:${b.color};flex:${Math.max(within[i], 0.04)}"></i>`,
        ).join("")}</div>
        <div class="scale"><span>0 min</span><span>${budget} min</span></div>
        <table>${RAMP.map(
          (b, i) => `<tr>
            <td class="swatch"><i style="background:${b.color}"></i></td>
            <td>${b.label}</td>
            <td class="n">${within[i].toLocaleString()}</td>
            <td class="share">${Math.round((within[i] / total) * 100)}%</td>
          </tr>`,
        ).join("")}</table>
      </div>`;

    if (!reduceMotion) {
      $("results").querySelectorAll(".ramp tr").forEach((row, i) => {
        row.animate([{ opacity: 0 }, { opacity: 1 }], {
          duration: 220, delay: i * 55, fill: "backwards",
        });
      });
    }
  }

  // ------------------------------------------------------------- errors
  function alarm(message) {
    const existing = document.querySelector(".alarm");
    if (existing) existing.remove();
    const box = document.createElement("p");
    box.className = "alarm";
    box.textContent = message;
    $("results").prepend(box);
  }
})();
</script>
</body>
</html>
